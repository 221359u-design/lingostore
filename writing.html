<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Lingo</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

<!-- Fun Fonts -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&display=swap" rel="stylesheet" />

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Other Dependencies -->
<script src="/pages/funFact.js"></script>

<style>
    body {
        background: linear-gradient(180deg, #ffe7cc, #fff5ec);
        font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
    }

    /* Top bar */
    .navbar-top {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 1.5rem;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .btn-menu, .btn-home {
        font-size: 1.8rem;
        cursor: pointer;
    }

    /* Title bar */
    .title-bar {
        background: linear-gradient(90deg, #9ed2e6, #b5ead7);
        font-weight: bold;
        font-size: 2rem;
        padding: 1rem;
        border-radius: 0 0 1rem 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 1.5rem;
    }

    /* Section container to center content and add spacing */
    section {
        max-width: 720px;
        margin: 0 auto 3rem auto;
        padding: 0 1rem;
    }

    /* Story Card */
    .story-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.2rem;
        color: #4a2c2a;
        line-height: 1.6;
        margin-bottom: 2rem;
    }
    .story-card h5.small-bold {
        font-weight: 700;
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
    }

    /* Vocabulary Card */
    .vocab-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.1rem;
        color: #4a2c2a;
        line-height: 1.5;
    }
    .vocab-card .small-bold {
        font-weight: 700;
        font-size: 1.4rem;
        margin-bottom: 1rem;
    }
    #vocab-list {
        padding-left: 1.25rem;
    }
    #vocab-list li {
        margin-bottom: 0.6rem;
    }

    /* Submit Button */
    .submit-btn {
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 2rem auto 0 auto;
        padding: 0.75rem 1.5rem;
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #7be06a, #55c653);
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .submit-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* Offcanvas Navbar */
    .menu-panel {
        background: linear-gradient(180deg, #ffb3ba, #ffdfba);
        color: #4a2c2a;
    }
    .menu-title {
        font-size: 1.8rem;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .menu-link {
        background: rgba(255,255,255,0.85);
        border-radius: 1rem;
        padding: 0.8rem;
        margin: 0.5rem 0;
        font-size: 1.3rem;
        font-weight: bold;
        color: #4a2c2a;
        display: flex;
        align-items: center;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .menu-link:hover {
        transform: scale(1.05);
        background: #fff5ec;
    }
    .menu-icon-emoji {
        font-size: 1.8rem;
        margin-right: 0.8rem;
    }

    /* Footer */
    .footer-bar {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 0.9rem;
        font-family: 'Pacifico', cursive;
        padding: 0.4rem 0;
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    }
     /* Image container with padding and rounded corners */
  .image-container {
    background-color: #f5d3c3;
    border-radius: 1rem;
    max-width: 350px;
    margin: 0 auto 2rem auto;
    padding: 1rem;
  }

  .image-container img {
    width: 100%;
    display: block;
    border-radius: 0.5rem;
  }

  /* Speech bubble style (now editable) */
  .speech-bubble {
    max-width: 600px;
    margin: 0 auto 2rem auto;
    padding: 1rem 1.5rem;
    border: 3px solid #0d1b4c;
    border-radius: 1rem;
    font-family: 'Noto Serif SC', serif;
    color: #0d1b4c;
    box-shadow: 2px 6px 12px rgba(0,0,0,0.1);
    min-height: 4rem;
  }

  /* Comment bubble without pointer, editable */
  .comment-bubble {
    max-width: 600px;
    margin: 0 auto 3rem auto;
    padding: 1rem 1.5rem;
    border: 3px solid #0d1b4c;
    border-radius: 1rem;
    font-family: 'Noto Serif SC', serif;
    color: #0d1b4c;
    box-shadow: 2px 6px 12px rgba(0,0,0,0.1);
    background: #fff;
  }

  .comment-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
    color: #0d1b4c;
  }

  .comment-text {
    font-size: 1rem;
    line-height: 1.5;
  }
   /* Title bar styling */
  #page-title {
    background: linear-gradient(90deg, #9ed2e6, #b5ead7);
    font-weight: bold;
    font-size: 2.5rem;
    padding: 1rem 1.5rem;
    border-radius: 0 0 1rem 1rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    color: #0d1b4c;
    font-family: 'Pacifico', cursive;
    text-align: center;
    margin: 0 0 1.5rem 0;
  }
</style>
</head>
<body>

<!-- Top Navbar -->
<div class="navbar-top d-flex justify-content-between align-items-center px-3 py-2">
    <i class="bi bi-list btn-menu text-dark" data-bs-toggle="offcanvas" data-bs-target="#mainMenu"></i>
    <div class="streak fw-bold">🔥 1</div>
</div>

<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start menu-panel" tabindex="-1" id="mainMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title menu-title">🌟 菜单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🏠</span> 首页</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🎮</span> 游戏</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">📚</span> 课程</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">👤</span> 我的账户</a>
    </div>
</div>

<!-- Main Content -->
<section>
    <!-- Title -->
<div class="container">
  <div id="page-title">笔下生花</div>
</div>

<!-- Image -->
<div class="image-container">
  <img src="/mnt/data/a975adb6-eb5c-4222-92c2-5ae786f5164b.png" alt="漫画示例" />
</div>

<!-- Empty speech bubble (editable) -->
<div class="speech-bubble" contenteditable="true"></div>

<!-- Comment bubble (editable) -->
<div class="comment-bubble" contenteditable="true">
  <div class="comment-title">评语：</div>
  <div class="comment-text">
    这段文字语言通顺，情节自然，表达了孩子对树木生长的惊讶，富有童趣和生活气息，能够引起读者的共鸣。“树长得比我还快”这个理解很可爱！结尾的感叹句增强了情感表达，使文章更生动。
  </div>
</div>
</section>


<!-- Footer -->
<div class="footer-bar fixed-bottom text-center">
    Made with ❤️ by Project Lingo
</div>

</body>
</html>
