<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侃侃而谈</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@700&family=Noto+Serif+SC&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background-color: #fff3e0;
    }

    .title-font {
        font-family: '优设自由棒棒体', 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
    }

    .bold-small {
        font-family: '字由点字简宋95', 'Noto Sans SC', sans-serif;
        font-weight: 700;
    }

    .normal-cn {
        font-family: '字由点宋', 'Noto Serif SC', serif;
    }

    /* Top bar */
    .top-bar {
        background-color: #f8d6c3;
        height: 8vh;
        display: flex;
        align-items: center;
        padding: 0 4vw;
    }

    .menu-icon {
        width: 8vw;
        height: 8vw;
        border-radius: 50%;
        background: linear-gradient(#a32564, #d96a8a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6vw;
        color: white;
        cursor: pointer;
    }

    /* Title */
    .title {
        text-align: center;
        font-size: 8vw;
        font-weight: bold;
        margin: 4vh 0 3vh 0;
    }

    /* Speech bubble prompt */
    .prompt-bubble {
        background: white;
        border: 2px solid black;
        border-radius: 20px;
        padding: 2vh 3vw;
        font-size: 4.5vw;
        text-align: center;
        margin: 0 auto 4vh auto;
        width: 80%;
    }

    /* Audio bubble small */
    .audio-bubble {
        background: white;
        display: inline-block;
        padding: 1.5vh 3vw;
        border: 2px solid black;
        border-radius: 20px;
        font-size: 4vw;
    }

    .audio-container {
        display: flex;
        justify-content: center;
        margin: 2vh 0;
    }

    /* Paragraph bubble */
    .paragraph-bubble {
        background: white;
        border: 2px solid black;
        border-radius: 15px;
        padding: 2vh 3vw;
        width: 85%;
        margin: 0 auto 3vh auto;
    }

    .para-title {
        font-size: 4.5vw;
        margin-bottom: 1vh;
    }

    .para-text {
        font-size: 3.8vw;
        margin-bottom: 1.5vh;
        line-height: 1.5;
    }

    /* Mic */
    .mic {
        display: flex;
        justify-content: center;
        margin: 3vh 0;
        font-size: 8vw;
    }

    /* Home */
    .home-bar {
        background-color: #f8d6c3;
        display: flex;
        justify-content: center;
        padding: 1.5vh 0;
        position: fixed;
        width: 100%;
        bottom: 0;
    }

    .home-icon {
        font-size: 8vw;
        cursor: pointer;
    }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <div class="menu-icon">≡</div>
</div>

<!-- Title -->
<div class="title title-font">侃侃而谈</div>

<!-- Prompt -->
<div class="prompt-bubble normal-cn">谈谈你平时喜欢吃的美食</div>

<!-- Audio -->
<div class="audio-container">
    <div class="audio-bubble normal-cn">🔊 0'39</div>
</div>

<!-- Paragraph -->
<div class="paragraph-bubble">
    <div class="para-title bold-small">评语：</div>
    <div class="para-text normal-cn">
        这段描述表达清晰，用词简单易懂。你很坦然介绍了自己喜欢的新加坡美食，并具体说明了喜欢的原因，比如“鸡肉海南饭”、“香味浓郁”等，能让读者感受到你对食物的喜爱。
    </div>
    <div class="para-text normal-cn">
        可以改进的地方是：试着加入一些令人感受或小故事，例如某次吃海南鸡饭的特别经历，或者和家人一起去小贩中心的回忆，这样能让内容更有温度，也更吸引人阅读。
    </div>
    <div class="para-text normal-cn">
        整体来说，这段内容真实，有条理，是一个不错的美食分享段落！
    </div>
</div>

<!-- Mic -->
<div class="mic">🎤</div>

<!-- Home -->
<div class="home-bar">
    <div class="home-icon">🏠</div>
</div>

</body>
</html>
