<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>侃侃而谈</title>

<!-- Bootstrap 5.3.0 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&family=Noto+Sans+SC:wght@700&family=Noto+Serif+SC&display=swap" rel="stylesheet" />

<style>
  body {
    background: linear-gradient(180deg, #ffe7cc, #fff5ec);
    font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    margin: 0;
    color: #0d1b4c;
  }

  /* Top bar */
  nav.bar-bg {
    background: linear-gradient(90deg, #ffb3ba, #ffdfba);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
  }

  /* Menu icon */
  .menu-btn {
    font-size: 1.8rem;
    cursor: pointer;
    color: #0d1b4c;
    user-select: none;
  }

  /* Title bar styling - same as other pages */
  #page-title {
    background: linear-gradient(90deg, #9ed2e6, #b5ead7);
    font-weight: bold;
    font-size: 2.5rem;
    padding: 1rem 1.5rem;
    border-radius: 0 0 1rem 1rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    color: #0d1b4c;
    font-family: 'Pacifico', cursive;
    text-align: center;
    margin: 0 0 1.5rem 0;
  }

  /* Bubble styles */
  .bubble {
    background-color: #ffffff;
    border-radius: 1rem;
    border: 3px solid #0d1b4c;
    padding: 1rem 1.5rem;
    box-shadow: 2px 6px 12px rgba(0,0,0,0.1);
    font-family: 'Noto Serif SC', serif;
    color: #0d1b4c;
    max-width: 800px;
    margin: 0 auto 1.5rem auto;
  }

  .bubble-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 0.75rem;
  }

  /* Audio bubble smaller */
  .audio-bubble {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.2rem;
    padding: 0.6rem 1.2rem;
    border: 2px solid #0d1b4c;
    border-radius: 50px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    font-family: 'Noto Serif SC', serif;
    color: #0d1b4c;
    margin: 0 auto 1.5rem auto;
    max-width: 200px;
    justify-content: center;
  }

  /* Mic */
  .mic {
    font-size: 2.5rem;
    text-align: center;
    margin: 2rem 0;
    cursor: pointer;
    user-select: none;
  }

  /* Home bar */
  .home-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: linear-gradient(90deg, #ffb3ba, #ffdfba);
    box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    padding: 0.5rem 0;
    text-align: center;
  }

  .home-icon {
    font-size: 2rem;
    color: #0d1b4c;
    user-select: none;
  }

  /* Offcanvas sidebar */
  .offcanvas {
    background: linear-gradient(90deg, #ffb3ba, #ffdfba);
    color: #0d1b4c;
  }

  .offcanvas-header,
  .offcanvas-body {
    padding: 1rem 1.5rem;
  }

  .offcanvas-title {
    font-family: 'Pacifico', cursive;
    font-size: 1.6rem;
    color: #0d1b4c;
  }

  .offcanvas ul li {
    padding: 0.5rem 0;
    font-size: 1.3rem;
    cursor: pointer;
  }

  .offcanvas ul li:hover {
    background-color: rgba(0, 0, 0, 0.05);
    border-radius: 0.5rem;
  }
</style>
</head>
<body>

<!-- Top Menu -->
<nav class="bar-bg">
  <span class="menu-btn" data-bs-toggle="offcanvas" data-bs-target="#mainMenu" aria-label="Toggle menu">☰</span>
</nav>

<!-- Offcanvas Sidebar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mainMenu" aria-labelledby="mainMenuLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="mainMenuLabel">菜单</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="list-unstyled">
      <li>🏠 首页</li>
      <li>🎮 游戏</li>
      <li>📚 课程</li>
      <li>👤 我的账户</li>
    </ul>
  </div>
</div>

<!-- Title -->
<div class="container">
  <div id="page-title">侃侃而谈</div>
</div>

<!-- Prompt Bubble -->
<div class="bubble normal-cn">谈谈你平时喜欢吃的美食</div>

<!-- Audio Bubble -->
<div class="audio-bubble">🔊 0'39</div>

<!-- Paragraph Bubble -->
<div class="bubble">
  <div class="bubble-title">评语：</div>
  <p>这段描述表达清晰，用词简单易懂。你很坦然介绍了自己喜欢的新加坡美食，并具体说明了喜欢的原因，比如“鸡肉海南饭”、“香味浓郁”等，能让读者感受到你对食物的喜爱。</p>
  <p>可以改进的地方是：试着加入一些令人感受或小故事，例如某次吃海南鸡饭的特别经历，或者和家人一起去小贩中心的回忆，这样能让内容更有温度，也更吸引人阅读。</p>
  <p>整体来说，这段内容真实，有条理，是一个不错的美食分享段落！</p>
</div>

<!-- Mic -->
<div class="mic" aria-label="麦克风按钮" role="button" tabindex="0">🎤</div>

<!-- Bottom Home Bar -->
<div class="home-bar">
  <span class="home-icon">🏠</span>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
