<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Lingo</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

<!-- Fun Fonts -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&display=swap" rel="stylesheet" />

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Other Dependencies -->
<script src="/pages/funFact.js"></script>

<style>
    body {
        background: linear-gradient(180deg, #ffe7cc, #fff5ec);
        font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
    }

    /* Top bar */
    .navbar-top {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 1.5rem;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .btn-menu, .btn-home {
        font-size: 1.8rem;
        cursor: pointer;
    }

    /* Title bar */
    .title-bar {
        background: linear-gradient(90deg, #9ed2e6, #b5ead7);
        font-weight: bold;
        font-size: 2rem;
        padding: 1rem;
        border-radius: 0 0 1rem 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 1.5rem;
    }

    /* Section container to center content and add spacing */
    section {
        max-width: 720px;
        margin: 0 auto 3rem auto;
        padding: 0 1rem;
    }

    /* Story Card */
    .story-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.2rem;
        color: #4a2c2a;
        line-height: 1.6;
        margin-bottom: 2rem;
    }
    .story-card h5.small-bold {
        font-weight: 700;
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
    }

    /* Vocabulary Card */
    .vocab-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.1rem;
        color: #4a2c2a;
        line-height: 1.5;
    }
    .vocab-card .small-bold {
        font-weight: 700;
        font-size: 1.4rem;
        margin-bottom: 1rem;
    }
    #vocab-list {
        padding-left: 1.25rem;
    }
    #vocab-list li {
        margin-bottom: 0.6rem;
    }

     /* Audio bubble */
    .audio-bubble {
        background: white;
        border: 2px solid #333;
        border-radius: 50px;
        font-size: 1.2rem;
        padding: 0.6rem 1.2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        font-family: 'Noto Serif SC', serif;
        color: #0d1b4c;
    }

    /* Question bubble */
    .question-bubble {
        background: white;
        border: 2px solid #333;
        border-radius: 15px;
        padding: 1rem;
        box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        color: #0d1b4c;
        font-family: 'Noto Serif SC', serif;
    }
    .question-header {
        background-color: #f8d6c3;
        padding: 0.5rem;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        font-family: 'Noto Sans SC', sans-serif;
        font-weight: 700;
        color: #0d1b4c;
    }
    .option {
        background-color: #f0f0f0;
        padding: 0.7rem;
        font-size: 1rem;
        margin-bottom: 0.7rem;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        font-family: 'Noto Serif SC', serif;
        color: #0d1b4c;
    }
    .option:hover {
        background-color: #ffe8cc;
    }

    /* Submit Button */
    .submit-btn {
        padding: 0.5rem 1.2rem;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #7be06a, #55c653);
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        white-space: nowrap;
    }
    .submit-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* Offcanvas Navbar */
    .menu-panel {
        background: linear-gradient(180deg, #ffb3ba, #ffdfba);
        color: #4a2c2a;
    }
    .menu-title {
        font-size: 1.8rem;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .menu-link {
        background: rgba(255,255,255,0.85);
        border-radius: 1rem;
        padding: 0.8rem;
        margin: 0.5rem 0;
        font-size: 1.3rem;
        font-weight: bold;
        color: #4a2c2a;
        display: flex;
        align-items: center;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .menu-link:hover {
        transform: scale(1.05);
        background: #fff5ec;
    }
    .menu-icon-emoji {
        font-size: 1.8rem;
        margin-right: 0.8rem;
    }

    /* Footer */
    .footer-bar {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 0.9rem;
        font-family: 'Pacifico', cursive;
        padding: 0.4rem 0;
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>

<!-- Top Navbar -->
<div class="navbar-top d-flex justify-content-between align-items-center px-3 py-2">
    <i class="bi bi-list btn-menu text-dark" data-bs-toggle="offcanvas" data-bs-target="#mainMenu"></i>
    <div class="streak fw-bold">🔥 1</div>
</div>

<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start menu-panel" tabindex="-1" id="mainMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title menu-title">🌟 菜单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🏠</span> 首页</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🎮</span> 游戏</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">📚</span> 课程</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">👤</span> 我的账户</a>
    </div>
</div>

<!-- Main Content -->
<div class="container text-center mb-4">
    <div class="title-bar">洗耳恭“听”</div>
</div>

<section class="container">
    <!-- Audio and Submit Button Row -->
    <div class="d-flex justify-content-center align-items-center my-4 gap-3">
        <div class="audio-bubble">
            🔊 <span>1'50</span>
        </div>
        <button class="submit-btn" type="submit">
            提交
        </button>
    </div>

    <!-- Question -->
    <div class="question-bubble">
        <div class="question-header">Q1: 以下哪个是新加坡的传统美食</div>
        <div class="option">沙嗲</div>
        <div class="option">南瓜派</div>
    </div>
</section>

<!-- Footer -->
<div class="footer-bar fixed-bottom text-center">
    Made with ❤️ by Project Lingo
</div>

</body>
</html
