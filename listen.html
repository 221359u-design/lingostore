<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>洗耳恭听</title>

<!-- Bootstrap 5.3.0 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&family=Noto+Sans+SC:wght@700&family=Noto+Serif+SC&display=swap" rel="stylesheet" />

<style>
    body {
        background: linear-gradient(180deg, #ffe7cc, #fff5ec);
        font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        margin: 0;
    }

    /* Title bar styling - matched to 博览群书 */
    .title-bar {
        background: linear-gradient(90deg, #9ed2e6, #b5ead7);
        font-weight: bold;
        font-size: 2.5rem;
        padding: 1rem 1.5rem;
        border-radius: 0 0 1rem 1rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        color: #0d1b4c;
        font-family: 'Pacifico', cursive;
        text-align: center;
        margin: 0; /* remove any default margin */
    }

    /* Small bold text */
    .bold-small {
        font-family: 'Noto Sans SC', sans-serif;
        font-weight: 700;
    }

    /* Normal Chinese font */
    .normal-cn {
        font-family: 'Noto Serif SC', serif;
    }

    /* Top bar */
    .top-bar {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 1.5rem;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        padding: 0.25rem 1rem;
    }
    .menu-icon, .home-icon {
        font-size: 1.8rem;
        cursor: pointer;
        color: #0d1b4c;
    }
    .streak {
        color: #0d1b4c;
    }

    /* Audio bubble */
    .audio-bubble {
        background: white;
        border: 2px solid #333;
        border-radius: 50px;
        font-size: 1.2rem;
        padding: 0.6rem 1.2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        font-family: 'Noto Serif SC', serif;
        color: #0d1b4c;
    }

    /* Question bubble */
    .question-bubble {
        background: white;
        border: 2px solid #333;
        border-radius: 15px;
        padding: 1rem;
        box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        color: #0d1b4c;
        font-family: 'Noto Serif SC', serif;
    }
    .question-header {
        background-color: #f8d6c3;
        padding: 0.5rem;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        font-family: 'Noto Sans SC', sans-serif;
        font-weight: 700;
        color: #0d1b4c;
    }
    .option {
        background-color: #f0f0f0;
        padding: 0.7rem;
        font-size: 1rem;
        margin-bottom: 0.7rem;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        font-family: 'Noto Serif SC', serif;
        color: #0d1b4c;
    }
    .option:hover {
        background-color: #ffe8cc;
    }

    /* Home bar */
    .home-bar {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
        padding: 0.5rem 0;
        text-align: center;
    }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar d-flex justify-content-between align-items-center">
    <!-- Menu button triggers offcanvas -->
    <i class="bi bi-list menu-icon" data-bs-toggle="offcanvas" data-bs-target="#mainMenu" aria-label="Toggle menu"></i>
</div>

<!-- Offcanvas Navbar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mainMenu" aria-labelledby="mainMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mainMenuLabel" style="font-family: 'Pacifico', cursive; font-size: 1.6rem; color: #0d1b4c;">菜单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="list-unstyled" style="color: #0d1b4c;">
            <li style="padding: 0.5rem 0; font-size: 1.3rem; cursor: pointer;">🏠 首页</li>
            <li style="padding: 0.5rem 0; font-size: 1.3rem; cursor: pointer;">🎮 游戏</li>
            <li style="padding: 0.5rem 0; font-size: 1.3rem; cursor: pointer;">📚 课程</li>
            <li style="padding: 0.5rem 0; font-size: 1.3rem; cursor: pointer;">👤 我的账户</li>
        </ul>
    </div>
</div>

<!-- Title Container to match 博览群书 spacing -->
<div class="container text-center mb-4">
    <div class="title-bar">洗耳恭“听”</div>
</div>

<!-- Main Content Section -->
<section class="container">
    <!-- Audio -->
    <div class="d-flex justify-content-center my-4">
        <div class="audio-bubble">
            🔊 <span>1'50</span>
        </div>
    </div>

    <!-- Question -->
    <div class="question-bubble">
        <div class="question-header">Q1: 以下哪个是新加坡的传统美食</div>
        <div class="option">沙嗲</div>
        <div class="option">南瓜派</div>
    </div>
</section>

<!-- Home Icon -->
<div class="home-bar fixed-bottom">
    <div>
        <div class="home-icon">🏠</div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
