<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Lingo</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

<!-- Fun Fonts -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&display=swap" rel="stylesheet" />

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Other Dependencies -->
<script src="/pages/funFact.js"></script>

<style>
    body {
        background: linear-gradient(180deg, #ffe7cc, #fff5ec);
        font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
    }

    /* Top bar */
    .navbar-top {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 1.5rem;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .btn-menu, .btn-home {
        font-size: 1.8rem;
        cursor: pointer;
    }

     .title-bar {
        background: linear-gradient(90deg, #9ed2e6, #b5ead7);
        font-weight: bold;
        font-size: 2rem;
        padding: 1rem;
        border-radius: 0 0 1rem 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 1.5rem;
        width: 100vw;
    	  margin-left: calc(-50vw + 50%);
    }

    /* Section container to center content and add spacing */
    section {
        max-width: 720px;
        margin: 0 auto 3rem auto;
        padding: 0 1rem;
    }

    /* Story Card */
    .story-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.2rem;
        color: #4a2c2a;
        line-height: 1.6;
        margin-bottom: 2rem;
    }
    .story-card h5.small-bold {
        font-weight: 700;
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
    }

    /* Vocabulary Card */
    .vocab-card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        padding: 1.5rem 2rem;
        font-size: 1.1rem;
        color: #4a2c2a;
        line-height: 1.5;
    }
    .vocab-card .small-bold {
        font-weight: 700;
        font-size: 1.4rem;
        margin-bottom: 1rem;
    }
    #vocab-list {
        padding-left: 1.25rem;
    }
    #vocab-list li {
        margin-bottom: 0.6rem;
    }

    /* Submit Button */
    .submit-btn {
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 2rem auto 0 auto;
        padding: 0.75rem 1.5rem;
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(135deg, #7be06a, #55c653);
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .submit-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* Offcanvas Navbar */
    .menu-panel {
        background: linear-gradient(180deg, #ffb3ba, #ffdfba);
        color: #4a2c2a;
    }
    .menu-title {
        font-size: 1.8rem;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .menu-link {
        background: rgba(255,255,255,0.85);
        border-radius: 1rem;
        padding: 0.8rem;
        margin: 0.5rem 0;
        font-size: 1.3rem;
        font-weight: bold;
        color: #4a2c2a;
        display: flex;
        align-items: center;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .menu-link:hover {
        transform: scale(1.05);
        background: #fff5ec;
    }
    .menu-icon-emoji {
        font-size: 1.8rem;
        margin-right: 0.8rem;
    }

    /* Footer */
    .footer-bar {
        background: linear-gradient(90deg, #ffb3ba, #ffdfba);
        font-size: 0.9rem;
        font-family: 'Pacifico', cursive;
        padding: 0.4rem 0;
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>

<!-- Top Navbar -->
<div class="navbar-top d-flex justify-content-between align-items-center px-3 py-2">
    <i class="bi bi-list btn-menu text-dark" data-bs-toggle="offcanvas" data-bs-target="#mainMenu"></i>
    <div class="streak fw-bold">🔥 1</div>
</div>

<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start menu-panel" tabindex="-1" id="mainMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title menu-title">🌟 菜单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🏠</span> 首页</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">🎮</span> 游戏</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">📚</span> 课程</a>
        <a href="#" class="menu-link"><span class="menu-icon-emoji">👤</span> 我的账户</a>
    </div>
</div>

<!-- Main Content -->
<section>
    <div class="title-bar text-center">博览群书</div>

    <!-- Story Card -->
    <div class="container mb-4">
      <div class="story-card" id="story-content"></div>
    </div>

    <!-- Vocabulary Card -->
    <div class="container mb-3">
      <div class="vocab-card">
        <div class="small-bold" id="vocab-title"></div>
        <ol id="vocab-list" class="mb-0"></ol>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="submit-btn" type="submit">提交</button>

</section>

<script>
  // Content Data
  const pageData = {
    title: "博览群书",
    story: {
      heading: "刻舟求剑",
      text: "从前，楚国有个人坐船渡江。船行到半路，他一不小心，把剑掉到了江里。他赶紧在船舷上刻了个记号，说：“我的剑从这里掉下去的。”船靠岸后，这个人就按照船上的记号，在船停泊的地方下水捞剑。可是，剑早已随着船的移动而漂走了。"
    },
    vocab: {
      title: "生词生字",
      words: [
        "刻：用刀在东西上面划出痕迹，比如在木头上刻字。",
        "靠岸：船开到河边停下来。",
        "停泊：船停下来的。",
        "船舷：船的边缘部分，也就是人坐在船边可以伸手碰到的地方。"
      ]
    }
  };

  // Render Function
  function renderPage(data) {
    document.getElementById('story-content').innerHTML = `
      <h5 class="small-bold mb-2">${data.story.heading}</h5>
      <p>${data.story.text}</p>
    `;

    document.getElementById('vocab-title').textContent = data.vocab.title;
    const vocabList = document.getElementById('vocab-list');
    vocabList.innerHTML = '';
    data.vocab.words.forEach(word => {
      const li = document.createElement('li');
      li.textContent = word;
      vocabList.appendChild(li);
    });
  }

  renderPage(pageData);
</script>

<!-- Footer -->
<div class="footer-bar fixed-bottom text-center">
    Made with ❤️ by Project Lingo
</div>

</body>
</html>
